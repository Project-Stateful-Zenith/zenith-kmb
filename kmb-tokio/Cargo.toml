[package]
name = "kmb-tokio"
version = "1.1.3"
edition = "2024"
rust-version = "1.88"
description = "Tokio transport for the kmb crate"
license = "Apache-2.0"
repository = "https://github.com/Project-Stateful-Zenith/zenith-kmb"
authors = ["Project-Stateful-Zenith Contributors"]

[lints]
workspace = true

[dependencies]
getrandom = "0.4.3"
kmb = { path = ".." }
webpki = { package = "rustls-webpki", version = "0.103.15", default-features = false, features = ["ring", "std"], optional = true }
sha2 = { version = "0.11.0", optional = true }
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging"], optional = true }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1.53", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "test-util", "time"] }

[features]
tls = ["dep:tokio-rustls", "dep:webpki", "dep:sha2"]
