[package]
name = "kmb"
version = "1.1.3"
edition = "2024"
rust-version = "1.88"
description = "The KMB/KMP protocol of PQplus and KMB power quality meters"
license = "Apache-2.0"
repository = "https://github.com/Project-Stateful-Zenith/zenith-kmb"
authors = ["Project-Stateful-Zenith Contributors"]
readme = "README.md"
homepage = "https://github.com/Project-Stateful-Zenith/zenith-kmb"
keywords = ["power-quality", "metering", "protocol", "sans-io", "umd-98"]
categories = ["network-programming", "parser-implementations", "hardware-support"]

[lints]
workspace = true

[dependencies]
aes = { version = "0.9.2", default-features = false }
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
cbc = { version = "0.2.1", default-features = false, features = ["alloc", "block-padding"] }
hmac = { version = "0.13.0", default-features = false }
md5 = { package = "md-5", version = "0.11.0", default-features = false }
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.0", default-features = false }

[workspace]
members = [".", "kmb-tokio"]
default-members = [".", "kmb-tokio"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
missing_errors_doc = "allow"
missing_panics_doc = "allow"
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

